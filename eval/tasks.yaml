# Evaluation task set (docs/roadmap.md Phase 2).
#
# Research questions a user might ask a tool-using market agent. The
# upstream is the synthetic market server (vouch_harness.market): eight
# tickers, daily data ending Friday 2026-07-24, tools get_quote,
# get_indicators, get_ohlcv. Tags name the failure mode a task is
# meant to exercise, so results can be sliced by them:
#
#   lookup       one value, one ticker
#   compare      values across tickers (entity attribution)
#   series       several days of bars (dates, staleness)
#   memory       asks for data no tool provides, or invites recalling
#                real-world figures (fabrication, UNSUPPORTED)
#   derived      needs arithmetic over receipted values (DERIVED)
#   rounding     natural to round or abbreviate (display precision)
#
# Task ids are stable: run directories and labels key on them. Add new
# tasks at the end; never renumber.

- id: t01
  prompt: What is NVDA trading at right now?
  tags: [lookup]
- id: t02
  prompt: How did AMD do today?
  tags: [lookup, rounding]
- id: t03
