# Fact extraction for run_sql (vouch_harness.analytics). Only the
# server's own `facts` array is receipted: one entry per (region,
# quarter) the query's rows mention, with the true figures from the
# server's table. The query's output columns are the agent's choice and
# could be literals, so they are never facts (#103).
tool: run_sql
asof_ptr: /as_of
facts:
  - ptr: /facts
    entity_ptr: /region
    each:
      - ptr: /revenue
        metric: revenue
        unit: USD
        tol_class: price
        asof_ptr: /period_end
      - ptr: /orders
        metric: orders
        tol_class: count
        asof_ptr: /period_end
      - ptr: /avg_order_value
        metric: avg_order_value
        unit: USD
        tol_class: price
        asof_ptr: /period_end
      - ptr: /return_rate_pct
        metric: return_rate_pct
        unit: pct
        tol_class: percentage
        asof_ptr: /period_end
