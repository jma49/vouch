# vouch: proxy, verifier, and harness in one image, sharing a receipts
# volume and a keys volume. Receipts are signed with Ed25519, and there is
# no default key on purpose. Create one first:
#   docker compose run --rm proxy keygen --out /app/keys
# verify and eval use only the public key but mount the whole volume
# read-only, private key included. For least privilege, copy
# vouch.pub.pem into a separate volume and mount only that.
# The image runs as uid 10001. Volumes created by an image from before
# that change are owned by root; hand them over once with
#   docker compose run --rm --user root --entrypoint chown proxy -R 10001:10001 /app/receipts /app/fixtures /app/keys
services:
  # The proxy speaks MCP over stdio, so it is run attached rather than
  # as a background service:
  #   docker compose run --rm proxy proxy --upstream "..." --receipts /app/receipts
  proxy:
    build: .
    environment:
      VOUCH_SIGNING_KEY: /app/keys/vouch.pem
    volumes:
      - receipts:/app/receipts
      - fixtures:/app/fixtures
      - keys:/app/keys
    stdin_open: true

  # docker compose run --rm verify --answer /app/answer.txt \
  #     --receipts /app/receipts/receipts.jsonl --tolerances /app/tolerance.yaml
  verify:
    build: .
    entrypoint: ["vouch-verify"]
    environment:
      VOUCH_PUBLIC_KEY: /app/keys/vouch.pub.pem
    volumes:
      - receipts:/app/receipts
      - keys:/app/keys:ro
      - ./answer.txt:/app/answer.txt:ro

  # docker compose run --rm eval --receipts /app/receipts/receipts.jsonl --n 10
  eval:
    build: .
    entrypoint: ["vouch-eval"]
    environment:
      VOUCH_PUBLIC_KEY: /app/keys/vouch.pub.pem
    volumes:
      - receipts:/app/receipts
      - keys:/app/keys:ro

volumes:
  receipts:
  fixtures:
  keys:
