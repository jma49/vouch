# Adversarial regression corpus for Tier 2 extraction and matching
# (docs/roadmap.md Phase 1).
#
# Unlike the harness gold set, these sentences are hand-written to read
# like agent prose, not like the extractor's templates. Each case pins
# the *complete* verdict list for its text: a spurious extra claim (a
# year read as a price) fails the case as surely as a wrong verdict.
#
# Expectation syntax:  "<claim text> -> <VERDICT> [(<entity> [<metric>])]"
# Claim text is the numeric token as the verifier reports it: digits
# plus any attached %, magnitude word, or multiplier; no currency sign,
# no trailing punctuation.
#
# Spec decisions encoded here:
# - Dates, times, quarters, ordinals, and period lengths ("50-day",
#   "5 sessions") are not claims.
# - Display rounding is judged against the claim's own precision:
#   "52.4 million" asserts 52.35M-52.45M; "182" asserts 181.5-182.5.
# - A percentage only resolves to a percentage metric; a bare number
#   never does. A percentage next to a non-price metric ("volume rose
#   12%") is not a day change and stays UNVERIFIABLE.
# - Entities bind within a clause, preferring the nearest preceding
#   mention; a sentence opening with a pronoun ("It", "Its", "The
#   stock") inherits the previous sentence's subject.
# - With several receipted values for the same (entity, metric), a
#   claim without a date is judged against the latest; a match only on
#   an older value is STALE. A stated date selects that date's value.
#
# `xfail: P-0xx` marks a case the current code gets wrong, tied to the
# pitfall that tracks it. Markers are strict: a fix that makes the case
# pass must remove the marker in the same commit.

