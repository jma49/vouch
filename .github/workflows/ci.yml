name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: proxy (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: proxy/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test (race detector, coverage)
        run: |
          go test -race -coverprofile=coverage.out ./...
          echo "### Go coverage: $(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: go build -o bin/vouch ./cmd/vouch

  python:
    name: verifier + harness (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "verifier[dev]" -e "harness[dev]"
      - name: Lint (ruff)
        run: |
          ruff check verifier harness
          ruff format --check verifier harness
      - name: Type-check verifier (mypy --strict)
        run: mypy
        working-directory: verifier
      - name: Type-check harness (mypy --strict)
        run: mypy
        working-directory: harness
      - name: Test verifier
        run: python -m pytest -q --cov=vouch_verifier --cov-report=term --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"
        working-directory: verifier
      - name: Test harness
        run: python -m pytest -q --cov=vouch_harness --cov-report=term --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"
        working-directory: harness

  golden:
    name: cross-language golden log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: proxy/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Go proxy writes the golden receipt log and the Python
      # verifier reads it. Regenerating must be a no-op: any drift in
      # canonicalization or signing shows up here as a dirty tree.
      - name: Regenerate golden log
        run: go test ./internal/store/ -run TestGoldenLog -update
        working-directory: proxy
      - name: Assert no drift
        run: git diff --exit-code testdata/receipts_golden.jsonl
      - name: Install python side
        run: pip install -e "verifier[dev]" -e "harness[dev]"
      - name: Verify golden log from python
        run: python -m pytest -q tests/test_receipts.py
        working-directory: verifier
      - name: Run eval
        run: |
          VOUCH_HMAC_KEY=vouch-golden-key vouch-eval \
            --receipts testdata/receipts_golden.jsonl --n 10 --tolerances tolerance.yaml
