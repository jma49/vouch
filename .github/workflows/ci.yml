name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: proxy (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: proxy/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test (race detector, coverage)
        run: |
          go test -race -coverprofile=coverage.out ./...
          echo "### Go coverage: $(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: go build -o bin/vouch ./cmd/vouch
      # A short pass on top of the committed corpus: enough to catch a
      # canonicalizer change that panics or stops being a fixed point.
      # Cross-language agreement is the differential test's job (golden).
      - name: Fuzz canonical JSON (30s)
        run: go test ./internal/receipt -run '^$' -fuzz FuzzCanonicalize -fuzztime 30s
      # Known vulnerabilities in reachable code, stdlib included: this is
      # why the toolchain tracks a supported Go release.
      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  integration:
    # The proxy against the official MCP reference server (a real SDK,
    # not vouch's own fakes): sampling, roots, elicitation, progress,
    # list_changed, concurrency, and cancellation, end to end.
    name: integration (MCP reference server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: proxy/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Integration tests
        run: make integration

  python:
    # Every supported interpreter: requires-python says >=3.11, and a
    # 3.12-only construct once slipped past a 3.12-only CI (#48).
    name: verifier + harness (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e "verifier[dev]" -e "harness[dev]"
      # Lint and formatting do not depend on the interpreter; run once.
      - name: Lint (ruff)
        if: matrix.python == '3.12'
        run: |
          ruff check verifier harness
          ruff format --check verifier harness
      - name: Type-check verifier (mypy --strict)
        run: mypy
        working-directory: verifier
      - name: Type-check harness (mypy --strict)
        run: mypy
        working-directory: harness
      - name: Test verifier
        run: python -m pytest -q --cov=vouch_verifier --cov-report=term
        working-directory: verifier
      - name: Test harness
        run: python -m pytest -q --cov=vouch_harness --cov-report=term
        working-directory: harness
      - name: Coverage summary
        if: matrix.python == '3.12'
        run: |
          (cd verifier && coverage report --format=markdown) >> "$GITHUB_STEP_SUMMARY"
          (cd harness && coverage report --format=markdown) >> "$GITHUB_STEP_SUMMARY"
      # Known vulnerabilities in the resolved dependency set of both
      # packages (the editable projects themselves are not on PyPI).
      - name: Dependency audit (pip-audit)
        if: matrix.python == '3.12'
        run: |
          pip install pip-audit==2.10.1
          pip-audit --skip-editable

  golden:
    name: cross-language golden log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: proxy/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The Go proxy writes the golden receipt log and the Python
      # verifier reads it. Regenerating must be a no-op: any drift in
      # canonicalization or signing shows up here as a dirty tree.
      - name: Regenerate golden log
        run: go test ./internal/store/ -run TestGoldenLog -update
        working-directory: proxy
      - name: Assert no drift
        run: git diff --exit-code testdata/receipts_golden.jsonl
      - name: Install python side
        run: pip install -e "verifier[dev]" -e "harness[dev]"
      - name: Verify golden log from python
        run: python -m pytest -q tests/test_receipts.py
        working-directory: verifier
      # The agent runner drives the real Go proxy in front of the
      # synthetic market server; this is the only job with both toolchains.
      - name: Build proxy
        run: go build -o bin/vouch ./cmd/vouch
        working-directory: proxy
      # Go and Python canonical JSON on generated documents and on the
      # Go fuzz corpus: identical bytes, or both refuse (Phase 4).
      - name: Differential canonical JSON (Go vs Python)
        run: python -m pytest -q tests/test_differential.py -rs
        working-directory: verifier
        env:
          VOUCH_DIFF_EXAMPLES: "500"
      - name: Agent end to end through the proxy
        run: python -m pytest -q tests/test_agent.py -k end_to_end -rs
        working-directory: harness
      # The same Go-signed log, verified independently by the Go reader;
      # the Python side verifies it in the tests above.
      - name: Verify golden log signatures (Go)
        run: ./proxy/bin/vouch receipts verify --require-sealed --public-key testdata/keys/golden.pub.pem testdata/receipts_golden.jsonl
      - name: Run eval
        run: |
          vouch-eval --receipts testdata/receipts_golden.jsonl --n 10 \
            --tolerances tolerance.yaml --public-key testdata/keys/golden.pub.pem
      # README metrics are generated; a hand edit or an unregenerated
      # behavior change shows up here as a stale README.
      - name: README is current
        run: python -m vouch_harness.readme README.md --check
